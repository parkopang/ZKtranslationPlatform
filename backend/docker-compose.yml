services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      DB_PATH: /app/data/translation.sqlite
      SEED_DEMO: ${SEED_DEMO:-false}
      ADMIN_KEY: ${ADMIN_KEY:-change-me}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      BIGMODEL_KEY_TYPE: ${BIGMODEL_KEY_TYPE:-platform_api}
      BIGMODEL_API_KEY: ${BIGMODEL_API_KEY:-}
      BIGMODEL_MODEL: ${BIGMODEL_MODEL:-glm-5.3-flash}
      BIGMODEL_BASE_URL: ${BIGMODEL_BASE_URL:-https://bigmodel.example.test/api/paas/v4/chat/completions}
      REDIS_URL: ${REDIS_URL:-}
      PRETRANSLATE_WORKERS: ${PRETRANSLATE_WORKERS:-2}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-translation}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - translation_data:/app/data
    restart: unless-stopped
volumes:
  translation_data:
