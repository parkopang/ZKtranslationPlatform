upstream translation_backend { server backend:8080; keepalive 16; }
upstream translation_frontend { server frontend:80; }
server {
  listen 80;
  server_name _;
  # Match the production proxy so the backend's 20 MB upload limit can be reached.
  client_max_body_size 50m;
  location = /simulation { return 302 /simulation/; }
  location /simulation/ { alias /simulation-public/; index index.html; add_header Cache-Control no-store; }
  location /api/ {
    proxy_pass http://translation_backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }
  location = /health { proxy_pass http://translation_backend/health; }
  location / {
    proxy_pass http://translation_frontend;
    proxy_set_header Host $http_host;
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '</head>' '<link rel="stylesheet" href="/simulation/workspace.css"></head>';
    sub_filter '</body>' '<script src="/simulation/workspace.js"></script></body>';
  }
}
