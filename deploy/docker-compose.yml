name: translation-platform

# Production single-node stack. Business data lives in MySQL, the queue uses
# the shared Redis instance, and source documents use Tencent COS. The local
# PostgreSQL/Redis/MinIO services are profile-gated for the simulation only.

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-translation-platform/backend:local}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    cpus: ${BACKEND_CPUS:-1.5}
    pids_limit: 256
    stop_grace_period: 20s
    ulimits:
      nofile: { soft: 4096, hard: 8192 }
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_ENGINE: ${DB_ENGINE:-mysql}
      DB_PATH: ${DB_PATH:-/app/data/translation.sqlite}
      MYSQL_HOST: ${MYSQL_HOST:-replace-with-mysql-host}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-replace-with-database-name}
      MYSQL_USER: ${MYSQL_USER:-replace-with-database-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_POOL_SIZE: ${MYSQL_POOL_SIZE:-10}
      MYSQL_CONNECT_TIMEOUT_MS: ${MYSQL_CONNECT_TIMEOUT_MS:-10000}
      MYSQL_SSL: ${MYSQL_SSL:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-standard}
      ADMIN_KEY: ${ADMIN_KEY:-replace-with-a-long-random-admin-key}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-replace-with-a-random-32-byte-secret-or-64-char-hex-key}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_PROVIDER_CHAIN: ${LLM_PROVIDER_CHAIN:-openai_compatible,bigmodel}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      OPENAI_COMPATIBLE_KEY_TYPE: ${OPENAI_COMPATIBLE_KEY_TYPE:-platform_api}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-plmf/glm-5.3-flash}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-https://provider.example.invalid/v2/openai/completions}
      OPENAI_COMPATIBLE_ALLOWED_ORIGIN: ${OPENAI_COMPATIBLE_ALLOWED_ORIGIN:-https://provider.example.invalid}
      BIGMODEL_KEY_TYPE: ${BIGMODEL_KEY_TYPE:-coding_plan}
      BIGMODEL_API_KEY: ${BIGMODEL_API_KEY:-}
      BIGMODEL_MODEL: ${BIGMODEL_MODEL:-glm-5.3-flash}
      BIGMODEL_BASE_URL: ${BIGMODEL_BASE_URL:-https://provider.example.invalid/api/coding/paas/v4/chat/completions}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_KEY_TYPE: ${MINIMAX_KEY_TYPE:-platform_api}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M2.7}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://provider.example.invalid/v1/chat/completions}
      LLM_RATE_LIMIT_DELAY_MS: ${LLM_RATE_LIMIT_DELAY_MS:-60000}
      LLM_FAILURE_COOLDOWN_MS: ${LLM_FAILURE_COOLDOWN_MS:-60000}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-2}
      LLM_REQUEST_TIMEOUT_MS: ${LLM_REQUEST_TIMEOUT_MS:-30000}
      LLM_TOTAL_TIMEOUT_MS: ${LLM_TOTAL_TIMEOUT_MS:-120000}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_RETRY_ATTEMPTS: ${LLM_RETRY_ATTEMPTS:-5}
      LLM_RETRY_BASE_MS: ${LLM_RETRY_BASE_MS:-500}
      LLM_RETRY_MAX_MS: ${LLM_RETRY_MAX_MS:-10000}
      # Optional per-provider overrides. Empty values intentionally fall back
      # to the shared LLM_* setting; this keeps one image usable in both
      # single-provider and primary/standby deployments.
      OPENAI_COMPATIBLE_MAX_CONCURRENCY: ${OPENAI_COMPATIBLE_MAX_CONCURRENCY:-}
      OPENAI_COMPATIBLE_REQUEST_TIMEOUT_MS: ${OPENAI_COMPATIBLE_REQUEST_TIMEOUT_MS:-}
      OPENAI_COMPATIBLE_TOTAL_TIMEOUT_MS: ${OPENAI_COMPATIBLE_TOTAL_TIMEOUT_MS:-}
      OPENAI_COMPATIBLE_MAX_TOKENS: ${OPENAI_COMPATIBLE_MAX_TOKENS:-}
      OPENAI_COMPATIBLE_RETRY_ATTEMPTS: ${OPENAI_COMPATIBLE_RETRY_ATTEMPTS:-}
      OPENAI_COMPATIBLE_RETRY_BASE_MS: ${OPENAI_COMPATIBLE_RETRY_BASE_MS:-}
      OPENAI_COMPATIBLE_RETRY_MAX_MS: ${OPENAI_COMPATIBLE_RETRY_MAX_MS:-}
      OPENAI_COMPATIBLE_RATE_LIMIT_DELAY_MS: ${OPENAI_COMPATIBLE_RATE_LIMIT_DELAY_MS:-}
      OPENAI_COMPATIBLE_FAILURE_COOLDOWN_MS: ${OPENAI_COMPATIBLE_FAILURE_COOLDOWN_MS:-}
      BIGMODEL_MAX_CONCURRENCY: ${BIGMODEL_MAX_CONCURRENCY:-}
      BIGMODEL_REQUEST_TIMEOUT_MS: ${BIGMODEL_REQUEST_TIMEOUT_MS:-}
      BIGMODEL_TOTAL_TIMEOUT_MS: ${BIGMODEL_TOTAL_TIMEOUT_MS:-}
      BIGMODEL_MAX_TOKENS: ${BIGMODEL_MAX_TOKENS:-}
      BIGMODEL_RETRY_ATTEMPTS: ${BIGMODEL_RETRY_ATTEMPTS:-}
      BIGMODEL_RETRY_BASE_MS: ${BIGMODEL_RETRY_BASE_MS:-}
      BIGMODEL_RETRY_MAX_MS: ${BIGMODEL_RETRY_MAX_MS:-}
      BIGMODEL_RATE_LIMIT_DELAY_MS: ${BIGMODEL_RATE_LIMIT_DELAY_MS:-}
      BIGMODEL_FAILURE_COOLDOWN_MS: ${BIGMODEL_FAILURE_COOLDOWN_MS:-}
      MINIMAX_MAX_CONCURRENCY: ${MINIMAX_MAX_CONCURRENCY:-}
      MINIMAX_REQUEST_TIMEOUT_MS: ${MINIMAX_REQUEST_TIMEOUT_MS:-}
      MINIMAX_TOTAL_TIMEOUT_MS: ${MINIMAX_TOTAL_TIMEOUT_MS:-}
      MINIMAX_MAX_TOKENS: ${MINIMAX_MAX_TOKENS:-}
      MINIMAX_RETRY_ATTEMPTS: ${MINIMAX_RETRY_ATTEMPTS:-}
      MINIMAX_RETRY_BASE_MS: ${MINIMAX_RETRY_BASE_MS:-}
      MINIMAX_RETRY_MAX_MS: ${MINIMAX_RETRY_MAX_MS:-}
      MINIMAX_RATE_LIMIT_DELAY_MS: ${MINIMAX_RATE_LIMIT_DELAY_MS:-}
      MINIMAX_FAILURE_COOLDOWN_MS: ${MINIMAX_FAILURE_COOLDOWN_MS:-}
      PRETRANSLATE_JOB_ATTEMPTS: ${PRETRANSLATE_JOB_ATTEMPTS:-3}
      PRETRANSLATE_RETRY_DELAY_MS: ${PRETRANSLATE_RETRY_DELAY_MS:-60000}
      PRETRANSLATE_WORKERS: ${PRETRANSLATE_WORKERS:-2}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-change-me}@replace-with-redis-host:6379/20}
      QUEUE_KEY_PREFIX: ${QUEUE_KEY_PREFIX:-translation}
      COS_BASE_URL: ${COS_BASE_URL:-https://replace-with-cos-host}
      COS_ENDPOINT: ${COS_ENDPOINT:-https://replace-with-cos-signing-endpoint}
      COS_BUCKET: ${COS_BUCKET:-replace-with-cos-bucket}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_ACCESS_KEY: ${COS_ACCESS_KEY:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://replace-with-cos-signing-endpoint}
      S3_BUCKET: ${S3_BUCKET:-replace-with-cos-bucket}
      S3_REGION: ${S3_REGION:-ap-guangzhou}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    expose: ["8080"]
    volumes:
      - translation_data:/app/data
    networks: [app]
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:8080/readyz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: ${FRONTEND_IMAGE:-translation-platform/frontend:local}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/var/log/nginx", "/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    cpus: ${FRONTEND_CPUS:-0.5}
    pids_limit: 128
    stop_grace_period: 10s
    logging: *default-logging
    expose: ["80"]
    networks: [app]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Local-only dependencies used by deploy/simulation/start.sh. They are not
  # started by the production command unless --profile simulation is supplied.
  postgres:
    profiles: [simulation]
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-768m}
    cpus: ${POSTGRES_CPUS:-1}
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-translation}
      POSTGRES_USER: ${POSTGRES_USER:-translation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [app]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    profiles: [simulation]
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    cpus: ${REDIS_CPUS:-0.5}
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-local-only}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-only}
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"]
    volumes: [redis_data:/data]
    networks: [app]
    healthcheck:
      test: [CMD-SHELL, "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    profiles: [simulation]
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    mem_limit: ${MINIO_MEMORY_LIMIT:-768m}
    cpus: ${MINIO_CPUS:-1}
    logging: *default-logging
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-only-minio-password}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes: [minio_data:/data]
    networks: [app]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio-init:
    profiles: [simulation]
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" && mc mb --ignore-existing local/$${S3_BUCKET}"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-only-minio-password}
      S3_BUCKET: ${S3_BUCKET:-translation}
    networks: [app]
    logging: *default-logging

  nginx:
    image: ${NGINX_IMAGE:-translation-platform/nginx:local}
    init: true
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/var/log/nginx", "/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
    mem_limit: ${NGINX_MEMORY_LIMIT:-128m}
    cpus: ${NGINX_CPUS:-0.5}
    pids_limit: 128
    stop_grace_period: 10s
    logging: *default-logging
    ports: ["${HTTP_PORT:-80}:80"]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [app]

networks:
  app: { driver: bridge }

volumes:
  translation_data:
  postgres_data:
  redis_data:
  minio_data:
