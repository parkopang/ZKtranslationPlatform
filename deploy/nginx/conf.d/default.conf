upstream translation_backend {
  server backend:8080;
  keepalive 32;
}

upstream translation_frontend {
  server frontend:80;
  keepalive 16;
}

# Preserve the public Host including its port for same-origin CSRF checks.
server {
  listen 80;
  server_name _;

  # Keep this endpoint useful to an external load balancer without requiring
  # the frontend bundle to be ready.
  location = /health {
    proxy_pass http://translation_backend/health;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Keep the API health probe available on the same public path used by the
  # frontend and external monitors.
  location = /api/health {
    proxy_pass http://translation_backend/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Readiness includes the database, model configuration, Redis worker and
  # object-storage configuration. Keep liveness and readiness separate so a
  # dependency restart does not make the container look dead.
  location = /readyz {
    proxy_pass http://translation_backend/readyz;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/readyz {
    proxy_pass http://translation_backend/api/readyz;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://translation_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://translation_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
